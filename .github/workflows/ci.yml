name: CI

on:
  push:
    branches: [master]
  pull_request:

# The contract is now a published dependency, so CI installs it from the registry
# like any other. This used to check both repositories out as siblings so that
# file:../schema would resolve - that is gone, and with it the class of failure
# where a lane compiled against whatever happened to be in the schema working tree
# at that instant.
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ["20", "22"]
    steps:
      - uses: actions/checkout@v4
        with:
          path: cli
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm install
        working-directory: cli
      - run: npm run lint
        working-directory: cli
      - run: npm run build
        working-directory: cli
      - run: npm test
        working-directory: cli
      # The console is part of the deliverable, so a build that no longer produces it
      # is a failure here rather than a surprise at `pitwall serve`.
      - run: npm run build:ui
        working-directory: cli
      # Assets arrived once with embedded generator provenance that nothing renders
      # and a careful review missed. This is cheap and it fails loudly.
      - run: bash scripts/check-brand-assets.sh
        working-directory: cli
