name: Release

# Publishing runs HERE rather than from a laptop, and carries no npm token.
#
# The registry mints a short-lived credential for this workflow through OIDC -
# npm calls it trusted publishing - so there is no secret to leak, nothing to
# rotate, and no one-time password to type. That last part is the point: the
# account has two-factor auth on writes, and npm's interactive fallback needs a
# TTY, so a publish could not be driven from a non-interactive session at all.
#
# The trust is configured once on npmjs.com against this repository AND this
# filename. Renaming this file silently breaks publishing, and the failure looks
# like an authentication error rather than a missing config.
#
# NOTHING PUBLISHES ON A PUSH TO master. A release is a tag, deliberately: the
# version that goes out is the one somebody named, not whatever landed last.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write        # REQUIRED. Without it OIDC cannot mint the credential.

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm 11.5.1+; the npm bundled with Node 22 is older.
      - run: npm install -g npm@latest
      - run: npm install
      - run: npm run lint
      - run: npm run build
      - run: npm test

      # A tag that disagrees with package.json publishes a version nobody asked
      # for, under a name that says otherwise. Cheaper to stop here.
      - name: Tag must match package.json
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "tag v$tag does not match package.json $pkg"; exit 1
          fi
          echo "tag and package.json agree on $pkg"

      # THE CONSOLE IS HALF THE PRODUCT AND IT IS EASY TO SHIP WITHOUT IT.
      #
      # `pitwall serve` reads its assets from dist/ui. Those come from vite, not
      # from tsc, so for as long as `build` was only tsc a green run produced a
      # tarball with a working CLI and no screen - and the failure would appear
      # for users rather than here. `build` now runs both, and this asserts the
      # result rather than trusting that it did.
      - name: The tarball must contain the console
        run: |
          test -f dist/ui/index.html || { echo "dist/ui/index.html missing - the console would ship broken"; exit 1; }
          npm pack --dry-run 2>&1 | grep -q "dist/ui/index.html" || { echo "dist/ui is present but not packed - check package.json files"; exit 1; }
          echo "console assets present and packed"

      # --provenance publishes a signed attestation linking the tarball to this
      # repository, commit and workflow.
      - run: npm publish --provenance --access public
